name: CI
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency: { group: ci-${{ github.ref }}, cancel-in-progress: true }

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: { node: [20, 22, 24] }
    steps:
      # TODO(security): pin every action to a full commit SHA (e.g. with `pinact`); Dependabot keeps them current.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - name: Lockfile is mandatory (integrity pins the font binaries and every dependency)
        run: test -f package-lock.json || (echo "package-lock.json missing: run 'npm install' once and commit it" && exit 1)
      - run: npm ci --ignore-scripts
      - name: Generated files are in sync with brand/
        run: npm run generate:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:fonts
      - run: npm run test:dist
      - run: npm run verify:release
      - name: Lint (non-blocking until the first clean run, then remove continue-on-error)
        run: npm run lint
        continue-on-error: true
      - name: Dependency audit (runtime deps must be clean)
        run: npm audit --omit=dev --audit-level=high

  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm run build && npm run build:fonts
      - name: Strict-CSP, zero-third-party-request, no-storage checks in real Chromium
        run: npm run test:e2e
