name: Platforms
# Compiles the generated non-web packages with their real toolchains. Kept separate from CI so a toolchain outage never blocks web work.
on:
  push: { branches: [main], paths: ['platforms/**', 'Package.swift', 'brand/**', 'scripts/generate/**'] }
  pull_request: { paths: ['platforms/**', 'Package.swift', 'brand/**', 'scripts/generate/**'] }
permissions: { contents: read }

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: '3.12' }
      - run: pip install ./platforms/python matplotlib plotly
      - run: python -I -m unittest discover -s platforms/python/tests -v

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { node-version: 22, cache: npm }
      # Fonts and logos are staged (not committed twice), so build the package from the staged copy.
      - run: npm ci --ignore-scripts && npm run build && npm run build:logos && npm run build:platforms
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with: { channel: stable }
      - run: flutter pub get
        working-directory: dist/platforms/flutter
      - run: flutter analyze --no-fatal-infos
        working-directory: dist/platforms/flutter
      - run: flutter test
        working-directory: dist/platforms/flutter

  swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: swift build
      - run: swift test

  android:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: platforms/android } }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - run: gradle :hexadata-brand:assembleRelease
