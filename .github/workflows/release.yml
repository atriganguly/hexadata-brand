name: Release
# Tag vX.Y.Z (must equal package.json version) -> verify everything, build release archives, create a GitHub release.
# Publishing to npm / PyPI is OFF until you set the repository VARIABLES PUBLISH_NPM=true / PUBLISH_PYPI=true, after configuring
# TRUSTED PUBLISHING on npmjs.com (package @hexadata/brand -> this repo + workflow release.yml + environment release) and on PyPI
# (project hexadata-brand). No long-lived tokens are used anywhere. Actions are pinned to full commit SHAs.
on:
  push: { tags: ['v*'] }
permissions: { contents: read }

jobs:
  build:
    runs-on: ubuntu-latest
    environment: release # require manual approval on this environment
    permissions: { contents: write, id-token: write, attestations: write }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm, registry-url: 'https://registry.npmjs.org' }
      - run: npm install -g npm@latest # trusted publishing needs a recent npm
      - run: npm ci --ignore-scripts
      - name: Tag must match package.json version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npx playwright install --with-deps chromium
      - run: npm run generate:check
      - run: npm run typecheck && npm run lint && npm run format:check && npm test
      - run: npm run build && npm run build:fonts && npm run build:logos
      - run: npm run test:dist && npm run test:e2e && npm run test:site
      - run: npm run verify:release && npm run pdf:check && npm run figma:check
      - run: npm audit --omit=dev --audit-level=high
      - name: Hosted channel (must be signed for a release)
        env: { HEXA_SIGNING_JWK: '${{ secrets.HEXA_SIGNING_JWK }}' }
        run: npm run build:channel -- --require-signed
      - name: Platform packages
        run: |
          npm run build:platforms
          mkdir -p release
          for p in flutter swift android office email print; do (cd dist/platforms/$p && zip -qr "../../../release/hexadata-brand-$p-${GITHUB_REF_NAME}.zip" .); done
          python -m pip install --quiet build
          (cd dist/platforms/python && python -m build --outdir ../../../release/python)
          (cd channel-out/v2 && zip -qr "../../release/hexadata-brand-channel-${GITHUB_REF_NAME}.zip" .)
          cp brand/kit/HexaData-Brand-Kit-v*.pdf release/
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format cyclonedx --omit dev > release/sbom.cdx.json
      - name: npm package tarball
        run: npm pack --ignore-scripts --pack-destination release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with: { subject-path: 'release/*.tgz' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: release, path: release }
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with: { files: 'release/**', generate_release_notes: true }
      - name: Publish to npm (OIDC trusted publishing, with provenance)
        if: vars.PUBLISH_NPM == 'true'
        run: npm publish --provenance --access public

  pypi:
    needs: build
    if: vars.PUBLISH_PYPI == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with: { name: release, path: release }
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with: { packages-dir: release/python }
